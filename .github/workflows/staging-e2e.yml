name: Staging E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-e2e
  cancel-in-progress: false

jobs:
  acceptance:
    name: Cross-portal acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      E2E_STOREFRONT_URL: https://mall-staging.350233.xyz
      E2E_MERCHANT_URL: https://merchant-staging.350233.xyz
      E2E_MERCHANT_EMAIL: ${{ secrets.STAGING_MERCHANT_EMAIL }}
      E2E_MERCHANT_PASSWORD: ${{ secrets.STAGING_MERCHANT_PASSWORD }}

    defaults:
      run:
        working-directory: apps/e2e

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run staging acceptance
        run: npm test

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: staging-e2e-${{ github.run_id }}
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14
