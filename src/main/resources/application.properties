spring.application.name=super-mall-backend

# Local secrets can live in the ignored .env.properties file.
spring.config.import=optional:file:./.env.properties,optional:file:./.env.merchant.properties

# MySQL connection. Production overrides every DB_* value with environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/super_mall?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# Flyway owns schema changes; Hibernate only validates entity mappings.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai

# API serialization and error safety.
spring.jackson.time-zone=Asia/Shanghai
spring.mvc.problemdetails.enabled=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Security. JWT_SECRET must be at least 32 UTF-8 bytes outside tests.
app.security.jwt-secret=${JWT_SECRET:}
app.security.jwt-issuer=${JWT_ISSUER:super-mall-backend}
app.security.jwt-audience=${JWT_AUDIENCE:super-mall-api}
app.security.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT2H}
app.security.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

# Merchant identities use a separate signing key and audience from customer accounts.
app.merchant-security.jwt-secret=${MERCHANT_JWT_SECRET:}
app.merchant-security.jwt-issuer=${MERCHANT_JWT_ISSUER:super-mall-merchant-backend}
app.merchant-security.jwt-audience=${MERCHANT_JWT_AUDIENCE:super-mall-merchant-api}
app.merchant-security.access-token-ttl=${MERCHANT_JWT_ACCESS_TOKEN_TTL:PT2H}
app.merchant-security.bootstrap-email=${MERCHANT_BOOTSTRAP_EMAIL:}
app.merchant-security.bootstrap-password=${MERCHANT_BOOTSTRAP_PASSWORD:}
app.merchant-security.bootstrap-name=${MERCHANT_BOOTSTRAP_NAME:商家主管}

# Real payment providers will replace this adapter. Keep disabled in production.
app.payment.sandbox-enabled=${PAYMENT_SANDBOX_ENABLED:false}

# Alipay computer website payment. Keys stay in environment variables or the ignored .env.properties file.
app.payment.alipay.enabled=${ALIPAY_ENABLED:false}
app.payment.alipay.gateway-url=${ALIPAY_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
app.payment.alipay.app-id=${ALIPAY_APP_ID:}
app.payment.alipay.private-key=${ALIPAY_PRIVATE_KEY:}
app.payment.alipay.alipay-public-key=${ALIPAY_PUBLIC_KEY:}
app.payment.alipay.seller-id=${ALIPAY_SELLER_ID:}
app.payment.alipay.notify-url=${ALIPAY_NOTIFY_URL:}
app.payment.alipay.return-url=${ALIPAY_RETURN_URL:http://localhost:5173/checkout/result}

# Unpaid orders release locked inventory automatically.
app.order.pending-payment-ttl=${ORDER_PENDING_PAYMENT_TTL:PT30M}
app.order.expiration-scan-interval=${ORDER_EXPIRATION_SCAN_INTERVAL:PT1M}

# Only health and info are exposed for deployment probes.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
