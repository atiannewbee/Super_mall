## 测试必须使用独立数据库，避免商家端联调数据污染固定种子断言。
## CI 如需覆盖地址，只能通过 DB_TEST_URL 指向专用测试库。
spring.datasource.url=${DB_TEST_URL:jdbc:mysql://localhost:3306/super_mall_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&createDatabaseIfNotExist=true}

app.security.jwt-secret=super-mall-integration-test-secret-2026-change-me
app.security.jwt-issuer=super-mall-test
app.security.jwt-audience=super-mall-api
app.security.access-token-ttl=PT30M
app.payment.sandbox-enabled=true
app.security.cors-allowed-origins=http://localhost:5173,http://127.0.0.1:5173
app.merchant-security.jwt-secret=super-mall-merchant-test-secret-2026-change-me
app.merchant-security.jwt-issuer=super-mall-merchant-test
app.merchant-security.jwt-audience=super-mall-merchant-api
app.merchant-security.access-token-ttl=PT30M
